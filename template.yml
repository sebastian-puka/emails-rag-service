AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Lambda to encode emails (Python)

Resources:
  emailsragservice:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: ''
      MemorySize: 128
      Timeout: 3
      Handler: lambda_function.lambda_handler 
      Runtime: python3.11
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          AWS_REGION: !Ref AwsRegion
          VECTOR_BUCKET: !Ref VectorBucket
          INDEX_NAME: !Ref IndexName
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Policies:
          - Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              - Effect: Allow
                Action:
                  - s3vectors:PutVectors
                Resource: !Sub arn:aws:s3vectors:${AwsRegion}:${AWSAccountId}:bucket/${VectorBucket}/index/${IndexName}
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: !Sub arn:aws:logs:${AwsRegion}:${AWSAccountId}:*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AwsRegion}:${AWSAccountId}:log-group:/aws/lambda/${LambdaFunctionName}:*
      RecursiveLoop: Terminate
      SnapStart:
        ApplyOn: None
      Events:
        Api1:
          Type: Api
          Properties:
            Path: /
            Method: POST
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto



Parameters:
  LambdaFunctionName:
    Type: String
    Description: Name of the deployed Lambda function
    Default: emails-rag-service

  AwsRegion:
    Type: String
    Description: AWS region for the Lambda function
    Default: us-east-1

  VectorBucket:
    Type: String
    Description: S3 bucket for storing vectors
    Default: email-test

  IndexName:
    Type: String
    Description: Index name for vector storage
    Default: notifications
  AWSAccountId:
    Type: String
    Description: AWS Account ID for resource permissions
    Default: 214899526005

Outputs:
  LambdaFunctionName:
    Description: Name of the deployed Lambda function
    Value: !Ref LambdaFunctionName